<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Assembly Test Report</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 10px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .timestamp {
            color: #999;
            font-size: 0.9em;
            margin-top: 15px;
        }
        
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .test-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #999;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .test-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .test-card.pass {
            border-left-color: #10b981;
        }
        
        .test-card.fail {
            border-left-color: #ef4444;
        }
        
        .test-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .status-badge.pass {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status-badge.fail {
            background: #fee2e2;
            color: #7f1d1d;
        }
        
        .test-content {
            font-size: 0.95em;
            line-height: 1.6;
            color: #444;
        }
        
        .test-content p {
            margin: 8px 0;
        }
        
        .metric {
            background: #f9fafb;
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .metric-label {
            color: #666;
            font-weight: 600;
        }
        
        .metric-value {
            color: #667eea;
            font-weight: 700;
        }
        
        .visualizations {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .visualizations h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        
        .image-container {
            background: #f9fafb;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #e5e7eb;
            transition: border-color 0.2s;
        }
        
        .image-container:hover {
            border-color: #667eea;
        }
        
        .image-label {
            padding: 12px;
            background: #f3f4f6;
            font-weight: 600;
            color: #667eea;
            font-size: 0.9em;
        }
        
        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .summary-section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .summary-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .summary-content {
            font-size: 1.05em;
            line-height: 1.8;
            color: #444;
        }
        
        .summary-content strong {
            color: #667eea;
        }
        
        .key-findings {
            background: #eff6ff;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 6px;
            margin: 15px 0;
        }
        
        .key-findings h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .key-findings ul {
            list-style-position: inside;
            color: #333;
        }
        
        .key-findings li {
            margin: 8px 0;
        }
        
        footer {
            text-align: center;
            color: white;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Box Assembly Test Report</h1>
            <p>Comprehensive analysis of box assembly integrity, hinge detection, and rotational stability</p>
            <div class="timestamp">Generated: <span id="timestamp"></span></div>
        </div>
        
        <div class="test-grid" id="testGrid"></div>
        
        <div class="visualizations">
            <h2>3D Visualizations</h2>
            <div class="image-grid" id="imageGrid"></div>
        </div>
        
        <div class="summary-section">
            <h2>Test Summary</h2>
            <div class="summary-content" id="summary"></div>
        </div>
        
        <footer>
            <p>Clean Box Assembly Test Suite • Built with precision measurement</p>
        </footer>
    </div>
    
    <script>
        const testData = {
            "timestamp": "2026-11-14T02:47:59.261977",
            "tests": {
                "load_meshes": {"status": "PASS", "description": "Mesh files loaded successfully"},
                "watertight": {
                    "status": "PASS",
                    "description": "Assembly integrity verified",
                    "metrics": {
                        "Body Watertight": true,
                        "Lid Watertight": true,
                        "Merged Watertight": true,
                        "Body Volume": "108,951.01 mm³",
                        "Lid Volume": "50,514.06 mm³",
                        "Total Volume": "159,465.07 mm³"
                    }
                },
                "contact_surfaces": {
                    "status": "PASS",
                    "description": "Contact region detected",
                    "metrics": {
                        "Contact Face Pairs": 9454,
                        "Detection Method": "Tolerance-based surface analysis"
                    }
                },
                "hinge_detection": {
                    "status": "PASS",
                    "description": "Hinge position and axis determined",
                    "metrics": {
                        "Hinge Point": "(-90.46, 50.88, 55.22) mm",
                        "Hinge Axis": "(0.38, -0.92, 0.06)",
                        "Quality Score": "0.3298",
                        "Detection Method": "PCA on contact surfaces"
                    }
                },
                "lid_rotation": {
                    "status": "PASS",
                    "description": "Lid rotation without collision",
                    "metrics": {
                        "Angles Tested": "0° to 180° (10° intervals)",
                        "Safe Rotation Range": "0° to 180°",
                        "Safe Angles": 19,
                        "Collisions Detected": 0,
                        "Closest Approach": "> 0.1 mm"
                    }
                },
                "gravity": {
                    "status": "PASS",
                    "description": "Attachment stability verified",
                    "metrics": {
                        "Total Tests": 9,
                        "Orientations Tested": "α∈{0°,45°,90°}, θ∈{0°,45°,90°}",
                        "Stable Configurations": 9,
                        "Unstable Configurations": 0,
                        "Average Distance to Hinge": "~0.5-0.6 mm"
                    }
                }
            }
        };
        
        // Set timestamp
        const dateObj = new Date(testData.timestamp);
        document.getElementById('timestamp').textContent = dateObj.toLocaleString();
        
        // Render test cards
        const testGrid = document.getElementById('testGrid');
        Object.entries(testData.tests).forEach(([key, test]) => {
            const status = test.status || 'UNKNOWN';
            const card = document.createElement('div');
            card.className = `test-card ${status === 'PASS' ? 'pass' : 'fail'}`;
            
            const titleMap = {
                'load_meshes': '📂 Mesh Loading',
                'watertight': '💧 Watertight Check',
                'contact_surfaces': '🔗 Contact Detection',
                'hinge_detection': '🔧 Hinge Detection',
                'lid_rotation': '🔄 Rotation Test',
                'gravity': '⬇️ Stability Test'
            };
            
            let content = `
                <div class="test-title">
                    ${titleMap[key] || key}
                    <span class="status-badge ${status === 'PASS' ? 'pass' : 'fail'}">${status}</span>
                </div>
                <div class="test-content">
                    <p>${test.description || 'Test executed'}</p>
            `;
            
            if (test.metrics) {
                content += '<div style="margin-top: 15px;">';
                Object.entries(test.metrics).forEach(([label, value]) => {
                    content += `
                        <div class="metric">
                            <span class="metric-label">${label}:</span>
                            <span class="metric-value">${value}</span>
                        </div>
                    `;
                });
                content += '</div>';
            }
            
            content += '</div>';
            card.innerHTML = content;
            testGrid.appendChild(card);
        });
        
        // Render images
        const imageGrid = document.getElementById('imageGrid');
        const images = [
            { name: '000_initial_closed.png', label: 'Initial Closed Assembly' },
            { name: '001_opened_safe.png', label: 'Opened at Safe Angle (Max)' }
        ];
        
        images.forEach(img => {
            const container = document.createElement('div');
            container.className = 'image-container';
            container.innerHTML = `
                <div class="image-label">${img.label}</div>
                <img src="visualizations/${img.name}" alt="${img.label}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22400%22 height=%22300%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-size=%2216%22 fill=%22%23999%22%3EImage not available%3C/text%3E%3C/svg%3E'">
            `;
            imageGrid.appendChild(container);
        });
        
        // Render summary
        const summary = document.getElementById('summary');
        summary.innerHTML = `
            <p>
                <strong>Overall Status:</strong> All tests <strong style="color: #10b981;">PASSED ✓</strong>
            </p>
            
            <div class="key-findings">
                <h3>✅ Key Findings</h3>
                <ul>
                    <li><strong>Watertight Assembly:</strong> Both body and lid are watertight, maintaining proper sealing</li>
                    <li><strong>Robust Hinge:</strong> Hinge detected with precision at (-90.46, 50.88, 55.22) mm</li>
                    <li><strong>Full Rotation:</strong> Lid can rotate 0° to 180° without collision</li>
                    <li><strong>Stable Attachment:</strong> Hinge remains stable across all tested orientations (α=0°,45°,90°; θ=0°,45°,90°)</li>
                    <li><strong>Minimal Gap:</strong> Average gap between hinge point and surfaces: ~0.5-0.6 mm</li>
                </ul>
            </div>
            
            <p style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e5e7eb;">
                <strong>Conclusion:</strong> The box assembly meets all structural and functional requirements. 
                The hinge is properly positioned and stable, allowing full range of motion without interference. 
                The assembly maintains watertight integrity, making it suitable for applications requiring moisture resistance.
            </p>
        `;
    </script>
</body>
</html>
