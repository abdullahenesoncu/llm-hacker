schema_version = "1.4"
artifacts = [
  { source = "/workspace/box.scad" },
  { source = "/workspace/bottom.stl" },
  { source = "/workspace/top.stl" },
  { source = "/workspace/hinge_bottom.stl" },
  { source = "/workspace/hinge_top.stl" },
]

[task]
name = "aeo/openscad-box-designer"
version = "1.0.0"
description = "Generate a complete OpenSCAD script for a 3D printable parametric storage box with a bottom body, a top lid and two hinge parts."
authors = []
keywords = ["openscad", "3d-design", "box", "lid", "hinge", "parametric"]

[metadata]

[verifier]
timeout_sec = 1200.0
environment_mode = "shared"
collect = []

[verifier.env]

[agent]
timeout_sec = 600.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
