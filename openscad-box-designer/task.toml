schema_version = "1.4"
artifacts = [
  { source = "/workspace/box.scad" },
  { source = "/workspace/bottom.stl" },
  { source = "/workspace/top.stl" },
  { source = "/workspace/hinge_bottom.stl" },
  { source = "/workspace/hinge_top.stl" },
]

[task]
name = "aeo/openscad-box-designer"
version = "1.0.0"
description = "Generate a complete OpenSCAD script for a 3D printable parametric storage box with a bottom body, a top lid and two hinge parts."
authors = []
keywords = ["openscad", "3d-design", "box", "lid", "hinge", "parametric"]

[metadata]
author_name = "Abdullah Enes Öncü"
author_email = "abdullahenesoncu@gmail.com"
author_organization = ""
category = "software-engineering"
tags = ["openscad", "3d-design", "geometry", "mechanical-design"]
difficulty_explanation = "Besides capture and collision-free rotation, the model must hit exact dimensions, use two symmetric hinge stations with sub-0.5 mm clearance, and avoid separate pins. The hinge axis must be inferred from contact geometry."
solution_explanation = "A parametric BOSL2/OpenSCAD script with a `show` selector renders bottom, top, hinge_bottom and hinge_top from one set of shared parameters, using an interlocking knuckle hinge that is captured in all translation directions."
verification_explanation = "tests/test_outputs.py loads the four STLs untransformed and checks mesh validity, watertightness (each part and combined), absence of volumetric overlap, hinge contact, axis inference from contact geometry, translational capture and collision-free lid rotation using trimesh and python-fcl."
expert_time_estimate_hours = 3
relevant_experience = ""

[verifier]
timeout_sec = 1200.0
environment_mode = "shared"
collect = []

[verifier.env]

[agent]
timeout_sec = 600.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []

